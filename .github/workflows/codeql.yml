name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 2 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Python analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python
