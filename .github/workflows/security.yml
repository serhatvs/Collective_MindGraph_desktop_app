name: Supply-chain security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked audit environment
        run: uv sync --frozen --extra dev
      - name: Export every locked dependency extra
        run: >-
          uv export --frozen --all-extras --no-dev
          --no-emit-project --no-hashes
          --output-file requirements-audit.txt
      - name: Audit all supported dependencies
        run: uv run pip-audit --requirement requirements-audit.txt
      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py requirements requirements-audit.txt
          --pyproject pyproject.toml --output-reproducible
          --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: collective-mindgraph-sbom
          path: sbom.json
          retention-days: 30

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The gitleaks Action reports through the GitHub API, which a private
      # repository without Advanced Security cannot reach. Running the released
      # binary scans the same history with no API dependency, so this gate
      # keeps working regardless of the plan.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full history for secrets
        run: ./gitleaks git . --no-banner --redact --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Dependency review needs the dependency graph, which GitHub only exposes
      # on a private repository with Advanced Security. The job reports that
      # plainly instead of failing the build or pretending it ran; pip-audit in
      # the job above is the gate that actually blocks vulnerable dependencies.
      - name: Check whether dependency review is available
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.security_and_analysis.advanced_security.status // "unavailable"')
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" != "enabled" ]; then
            echo "::notice::Dependency review skipped: Advanced Security is ${status} on this private repository. pip-audit remains the enforcing dependency gate."
          fi
      - uses: actions/dependency-review-action@v5
        if: steps.probe.outputs.status == 'enabled'
        with:
          fail-on-severity: high
